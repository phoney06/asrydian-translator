<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asrydian Translator</title>
<style>
:root {
  --bg:#0b1020; --panel:#121a2f; --panel2:#18223b; --text:#eef2ff; --muted:#9aa7c7;
  --accent:#7c3aed; --accent2:#22d3ee; --border:#2b3656; --good:#34d399; --warn:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:
radial-gradient(circle at top left,#1b2450 0,transparent 35%),
radial-gradient(circle at top right,#1d3a45 0,transparent 28%),var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1180px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.04em}
.brand p{margin:8px 0 0;color:var(--muted)}
.badge{padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:#10182b;color:var(--accent2);font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
nav button,.swap,.clear,.copy-btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:10px 14px;border-radius:12px;cursor:pointer}
nav button.active{background:linear-gradient(135deg,var(--accent),#4f46e5);border-color:transparent}
.panel{background:rgba(18,26,47,.92);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.search-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.search-box label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:7px}
.search-box input{width:100%;font-size:1.05rem;padding:15px 16px;border-radius:14px;border:1px solid var(--border);background:#0f172a;color:var(--text);outline:none}
.search-box input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.swap{font-size:1.25rem;width:48px;height:48px;padding:0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
select{background:#0f172a;color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:10px}
.results{display:grid;gap:12px;margin-top:18px}
.card{background:#0f172a;border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px}
.card h3{margin:0 0 6px;font-size:1.15rem}
.translation{font-size:1.35rem;color:var(--accent2);font-weight:800}
.meta{color:var(--muted);font-size:.9rem;line-height:1.5}
.tag{display:inline-block;background:#242f50;border:1px solid #34415f;padding:4px 8px;border-radius:999px;margin-right:6px;margin-top:8px;font-size:.78rem}
.empty{padding:32px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.9rem}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ref-card{background:#0f172a;border:1px solid var(--border);border-radius:16px;padding:16px}
.ref-card h3{margin-top:0;color:var(--accent2)}
.ref-card table{width:100%;border-collapse:collapse}
.ref-card td,.ref-card th{border-bottom:1px solid var(--border);padding:9px 6px;text-align:left;vertical-align:top}
.hidden{display:none}
.footer{margin-top:20px;color:var(--muted);font-size:.9rem;text-align:center}
.warning{border-left:4px solid var(--warn);padding-left:12px}
@media(max-width:760px){
  .search-grid{grid-template-columns:1fr}
  .swap{transform:rotate(90deg);justify-self:center}
  .card{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="brand">
    <h1>Asrydian Translator</h1>
    <p>Live English ↔ Asrydian search, automatically loaded from the master Google Sheet.</p>
  </div>
  <div class="badge">Loading live entries…</div>
</header>

<nav>
  <button class="tab active" data-tab="translator">Translator</button>
  <button class="tab" data-tab="grammar">Grammar</button>
  <button class="tab" data-tab="pronunciation">Pronunciation</button>
  <button class="tab" data-tab="lessons">Lessons</button>
  <button class="tab" data-tab="numbers">Number Rules</button>
  <button class="tab" data-tab="review">Needs Review</button>
</nav>

<section id="translator" class="tabpage panel">
  <div class="search-grid">
    <div class="search-box">
      <label id="leftLabel">English</label>
      <input id="query" placeholder="Type a word or phrase..." autocomplete="off">
    </div>
    <button class="swap" id="swap" title="Swap direction">⇄</button>
    <div class="search-box">
      <label id="rightLabel">Asrydian</label>
      <input id="translationBox" placeholder="Translation appears here" readonly>
    </div>
  </div>
  <div class="controls">
    <select id="category"><option value="">All categories</option></select>
    <select id="matchMode">
      <option value="contains">Contains</option>
      <option value="starts">Starts with</option>
      <option value="exact">Exact match</option>
    </select>
    <button class="clear" id="clear">Clear</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
</section>

<section id="grammar" class="tabpage panel hidden"></section>
<section id="pronunciation" class="tabpage panel hidden"></section>
<section id="lessons" class="tabpage panel hidden"></section>
<section id="numbers" class="tabpage panel hidden"></section>
<section id="review" class="tabpage panel hidden"></section>

<div class="footer">Live-connected to the MASTER DICTIONARY Google Sheet. Add a row there, then refresh this page.</div>
</div>

<script>
let dictionary = [];
const LIVE_SHEET_CSV = "https://docs.google.com/spreadsheets/d/1G_9jYq_G88jC6eUKOyz8hSekGLLuVrwRAPSQQ-UGnmE/gviz/tq?tqx=out:csv&sheet=MASTER%20DICTIONARY";
const grammarData = [{"Rule": "Plural ending", "English Form": "English plural / -s", "Asrydian Form": "-t", "Explanation": "A final T marks a plural word.", "Example": "Hammer → Hammers: Myolthde → Myolthdet"}, {"Rule": "Continuous ending", "English Form": "-ing", "Asrydian Form": "-eif", "Explanation": "Attach Eif to the word.", "Example": "Do → Doing: Lul → Luleif"}, {"Rule": "Agent/person ending", "English Form": "-er", "Asrydian Form": "-de", "Explanation": "Attach De to the word.", "Example": "Common → Commoner: Einusd → Einusdulde"}, {"Rule": "Past ending", "English Form": "-ed", "Asrydian Form": "-ina", "Explanation": "Attach Ina to the word.", "Example": "Learn → Learned: Luenskľ → Luenskľina"}];
const pronunciationData = [{"Written Pattern": "S at the beginning or end of a word", "Sound": "S", "Rule": "Pronounced as a normal S sound."}, {"Written Pattern": "S inside a word", "Sound": "Sh", "Rule": "Pronounced as an SH sound."}, {"Written Pattern": "K next to E", "Sound": "Ch", "Rule": "The pair makes a CH sound."}, {"Written Pattern": "K next to L", "Sound": "C", "Rule": "The pair makes a C sound."}, {"Written Pattern": "’e", "Sound": "Silent", "Rule": "The ’e sequence is silent."}, {"Written Pattern": "ľ", "Sound": "Silent", "Rule": "The letter ľ is silent."}, {"Written Pattern": "G", "Sound": "Guh or Juh", "Rule": "The speaker may choose either pronunciation."}];
const lessonsData = [{"Lesson": 1, "English": "Good morning Asmonia.", "Asrydian": "Feloen kľuthulaeif Asmonia"}, {"Lesson": 1, "English": "Good night Asmonia.", "Asrydian": "Feloen mers Asmonia"}, {"Lesson": 1, "English": "How are you?", "Asrydian": "Fliken tei gan?"}, {"Lesson": 1, "English": "I’m good.", "Asrydian": "Thye feloen."}, {"Lesson": 1, "English": "I’m okay, and you?", "Asrydian": "Thye byos, ta gan?"}, {"Lesson": 1, "English": "What are you doing?", "Asrydian": "Irel tei gan luleif?"}, {"Lesson": 1, "English": "Who can play in the tournament?", "Asrydian": "Ghelľ glatim halugen raiysa gona warthestal?"}, {"Lesson": 1, "English": "Pray to our Goddess Jazmine and God Jrock.", "Asrydian": "Esbe gorlsi tif Mlorfia Gasmin’e ta Mlorfia Grok."}, {"Lesson": 1, "English": "I’ve brought in my recruit.", "Asrydian": "Thye kľrudai raisya reei ufola."}, {"Lesson": 1, "English": "I can play in the tournament, your majesty.", "Asrydian": "Thye glatim halugen raiysa gona warthestal, ganil floera."}, {"Lesson": 1, "English": "I finished my task, your majesty.", "Asrydian": "Thye breinolaina reei dentes, ganil floera."}, {"Lesson": 1, "English": "Thank you.", "Asrydian": "Klusda gan."}, {"Lesson": 1, "English": "You’re welcome.", "Asrydian": "Ganil nyels."}, {"Lesson": 1, "English": "Reminder to not talk in the chats during the hours of 12am–6am EST.", "Asrydian": "Glaidode golrsi maith hafa raisya gona wa’ekt ainieif gona roet ebof dekai rauthen kľuthulaeif nasa gonu kľuthulaeif EST."}, {"Lesson": 2, "English": "Hello.", "Asrydian": "Klibona."}, {"Lesson": 2, "English": "Goodbye.", "Asrydian": "Hofoen."}, {"Lesson": 2, "English": "Hi.", "Asrydian": "Klibo."}, {"Lesson": 2, "English": "Bye.", "Asrydian": "Hofe."}, {"Lesson": 2, "English": "Hey, how are you today?", "Asrydian": "Safor, fliken tei gan fali?"}, {"Lesson": 2, "English": "Good morning.", "Asrydian": "Feloen kľuthulaeif."}, {"Lesson": 2, "English": "Good night.", "Asrydian": "Feloen mers."}, {"Lesson": 2, "English": "Good day!", "Asrydian": "Feloen fali!"}, {"Lesson": 2, "English": "Yes.", "Asrydian": "Hestho."}, {"Lesson": 2, "English": "No.", "Asrydian": "Mai."}, {"Lesson": 2, "English": "I understand.", "Asrydian": "Thye otolurthel."}, {"Lesson": 2, "English": "Understood.", "Asrydian": "Rarendomen."}, {"Lesson": 2, "English": "I don’t understand.", "Asrydian": "Thye lulmai otolurthel."}, {"Lesson": 2, "English": "Of course.", "Asrydian": "Ebof nelis."}, {"Lesson": 2, "English": "No problem.", "Asrydian": "Thye yenbo."}, {"Lesson": 2, "English": "Maybe.", "Asrydian": "Ofeig."}, {"Lesson": 2, "English": "Sure.", "Asrydian": "Gakľul."}, {"Lesson": 2, "English": "Okay.", "Asrydian": "Byos."}, {"Lesson": 3, "English": "Tournament.", "Asrydian": "Warthestal"}, {"Lesson": 3, "English": "Gold.", "Asrydian": "Klaga / Kalga"}];
const numberRulesData = [{"Unit": "Hundreds", "Range": "100–999", "Unit Word": "Thradek", "Formation Pattern": "(1–9) + Thradek", "Notes": "100 = Thradek; larger hundreds use a number before the unit."}, {"Unit": "Thousands", "Range": "1,000–999,999", "Unit Word": "Kentrafa", "Formation Pattern": "(number under 1,000) + Kentrafa", "Notes": "Largest unit is spoken first."}, {"Unit": "Millions", "Range": "1,000,000–999,999,999", "Unit Word": "Mireth", "Formation Pattern": "(number under 1,000) + Mireth", "Notes": "Largest unit is spoken first."}, {"Unit": "Billions", "Range": "1,000,000,000–999,999,999,999", "Unit Word": "Thrathethal", "Formation Pattern": "(number under 1,000) + Thrathethal", "Notes": "Largest unit is spoken first."}, {"Unit": "Trillions", "Range": "1,000,000,000,000+", "Unit Word": "Thrathethalen", "Formation Pattern": "(number under 1,000) + Thrathethalen", "Notes": "Largest unit is spoken first."}, {"Unit": "Universal Large Number Law", "Range": "", "Unit Word": "", "Formation Pattern": "", "Notes": ""}, {"Unit": "1", "Range": "Always speak the largest unit first.", "Unit Word": "", "Formation Pattern": "", "Notes": ""}, {"Unit": "2", "Range": "Never reverse the order.", "Unit Word": "", "Formation Pattern": "", "Notes": ""}, {"Unit": "3", "Range": "Never use a word for “and” inside a number.", "Unit Word": "", "Formation Pattern": "", "Notes": ""}, {"Unit": "4", "Range": "Each large unit behaves like a multiplier.", "Unit Word": "", "Formation Pattern": "", "Notes": ""}, {"Unit": "5", "Range": "Asrydian numbers are written in letter form only, not with digits.", "Unit Word": "", "Formation Pattern": "", "Notes": ""}];
const reviewData = [{"English / Topic": "Okay", "Version A": "Byos", "Version B": "Boys", "Reason": "Likely a typo in the newer list; Lesson 2 uses Byos."}, {"English / Topic": "Play", "Version A": "Halugen", "Version B": "Halujen", "Reason": "New vocabulary and lessons use Halugen."}, {"English / Topic": "Gold", "Version A": "Klaga", "Version B": "Kalga", "Reason": "Common-word list uses Klaga; color list uses Kalga."}, {"English / Topic": "Who", "Version A": "Gehlľ", "Version B": "Ghelľ", "Reason": "Dictionary uses Gehlľ; Lesson 1 uses Ghelľ."}, {"English / Topic": "To", "Version A": "Gorlsi", "Version B": "Golrsi", "Reason": "Dictionary uses Gorlsi; long reminder phrase uses Golrsi."}, {"English / Topic": "In", "Version A": "Raisya", "Version B": "Raiysa", "Reason": "Dictionary uses Raisya; lesson sentence uses Raiysa."}, {"English / Topic": "Be", "Version A": "Frukľ", "Version B": "Wainkľaf", "Reason": "Two translations may represent different grammatical contexts."}, {"English / Topic": "Home", "Version A": "Yegelnora", "Version B": "Thaluseni", "Reason": "Two translations may represent different meanings or contexts."}, {"English / Topic": "Gold lesson entry", "Version A": "Gold", "Version B": "No translation supplied", "Reason": "Lesson 3 only listed the English word; both known spellings are noted."}];

let direction = "en-as";
const query = document.getElementById("query");
const translationBox = document.getElementById("translationBox");
const results = document.getElementById("results");
const category = document.getElementById("category");
const stats = document.getElementById("stats");

function populateCategories(){
  category.innerHTML = '<option value="">All categories</option>';
  const categories = [...new Set(dictionary.map(x => x["Category"]).filter(Boolean))].sort();
  categories.forEach(c => {
    const o=document.createElement("option"); o.value=c; o.textContent=c; category.appendChild(o);
  });
}

function norm(s){return String(s||"").trim().toLocaleLowerCase();}
function matches(text,q,mode){
  text=norm(text); q=norm(q);
  if(!q) return true;
  if(mode==="exact") return text===q;
  if(mode==="starts") return text.startsWith(q);
  return text.includes(q);
}
function fieldNames(){
  return direction==="en-as"
   ? ["English","Asrydian / Asmonian","English","Asrydian"]
   : ["Asrydian / Asmonian","English","Asrydian","English"];
}
function render(){
  const q=query.value;
  const [source,target] = fieldNames();
  const mode=document.getElementById("matchMode").value;
  const cat=category.value;
  let filtered=dictionary.filter(x => (!cat || x.Category===cat) && matches(x[source],q,mode));
  filtered=filtered.slice(0,100);
  translationBox.value = filtered.length===1 ? filtered[0][target] : "";
  stats.textContent = q ? `${filtered.length} result${filtered.length===1?"":"s"} shown` : `Browse all ${dictionary.length} live entries`;
  if(!filtered.length){
    results.innerHTML='<div class="empty">No matching translation found.</div>'; return;
  }
  results.innerHTML=filtered.map(x=>`
    <div class="card">
      <div>
        <h3>${escapeHtml(x[source]||"(blank)")}</h3>
        <div class="translation">${escapeHtml(x[target]||"Translation missing")}</div>
        <div class="meta">
          ${x["Grammar / Form"]?`<div>${escapeHtml(x["Grammar / Form"])}</div>`:""}
          ${x.Notes?`<div>${escapeHtml(x.Notes)}</div>`:""}
          ${x.Root?`<div>Root: ${escapeHtml(x.Root)}</div>`:""}
        </div>
        ${x.Category?`<span class="tag">${escapeHtml(x.Category)}</span>`:""}
      </div>
      <button class="copy-btn" onclick='copyText(${JSON.stringify(x[target]||"")})'>Copy</button>
    </div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function copyText(t){navigator.clipboard?.writeText(t);}
query.addEventListener("input",render);
category.addEventListener("change",render);
document.getElementById("matchMode").addEventListener("change",render);
document.getElementById("clear").addEventListener("click",()=>{query.value="";translationBox.value="";render();query.focus();});
document.getElementById("swap").addEventListener("click",()=>{
  direction=direction==="en-as"?"as-en":"en-as";
  document.getElementById("leftLabel").textContent=direction==="en-as"?"English":"Asrydian";
  document.getElementById("rightLabel").textContent=direction==="en-as"?"Asrydian":"English";
  query.placeholder=direction==="en-as"?"Type an English word or phrase...":"Type an Asrydian word or phrase...";
  render();
});

function simpleCards(data,titleField,bodyFields){
  return `<div class="ref-grid">`+data.map(x=>`
  <div class="ref-card"><h3>${escapeHtml(x[titleField]||"")}</h3>
  ${bodyFields.map(f=>x[f]?`<div class="meta"><strong>${escapeHtml(f)}:</strong> ${escapeHtml(x[f])}</div>`:"").join("")}
  </div>`).join("")+`</div>`;
}
document.getElementById("grammar").innerHTML=simpleCards(grammarData,"Rule",["English Form","Asrydian Form","Explanation","Example"]);
document.getElementById("pronunciation").innerHTML=simpleCards(pronunciationData,"Written Pattern",["Sound","Rule"]);
document.getElementById("numbers").innerHTML=simpleCards(numberRulesData,"Unit",["Range","Unit Word","Formation Pattern","Notes"]);
document.getElementById("review").innerHTML='<div class="warning"><h2>Spellings or meanings to confirm</h2><p>These were kept instead of silently choosing one version.</p></div>'+simpleCards(reviewData,"English / Topic",["Version A","Version B","Reason"]);

const lessonGroups={};
lessonsData.forEach(x=>{(lessonGroups[x.Lesson]??=[]).push(x)});
document.getElementById("lessons").innerHTML=Object.entries(lessonGroups).map(([n,items])=>`
<div class="ref-card" style="margin-bottom:14px"><h3>Lesson ${escapeHtml(n)}</h3>
<table><thead><tr><th>English</th><th>Asrydian</th></tr></thead>
<tbody>${items.map(x=>`<tr><td>${escapeHtml(x.English)}</td><td>${escapeHtml(x.Asrydian)}</td></tr>`).join("")}</tbody>
</table></div>`).join("");

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tabpage").forEach(p=>p.classList.add("hidden"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.tab).classList.remove("hidden");
}));

function parseCSV(text){
  const rows=[];
  let row=[], field="", quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(quoted){
      if(ch === '"' && next === '"'){ field += '"'; i++; }
      else if(ch === '"'){ quoted=false; }
      else { field += ch; }
    } else {
      if(ch === '"'){ quoted=true; }
      else if(ch === ','){ row.push(field); field=""; }
      else if(ch === '\n'){ row.push(field.replace(/\r$/,"")); rows.push(row); row=[]; field=""; }
      else { field += ch; }
    }
  }
  if(field.length || row.length){ row.push(field.replace(/\r$/,"")); rows.push(row); }
  return rows;
}

async function loadLiveDictionary(){
  stats.textContent = "Loading the live Google Sheet…";
  results.innerHTML = '<div class="empty">Connecting to the master dictionary…</div>';
  try{
    const response = await fetch(LIVE_SHEET_CSV, {cache:"no-store"});
    if(!response.ok) throw new Error(`Google Sheets returned ${response.status}`);
    const csv = await response.text();
    const table = parseCSV(csv);
    if(table.length < 2) throw new Error("The sheet did not return dictionary rows.");
    const headers = table[0].map(h => h.trim());
    dictionary = table.slice(1).map(row => {
      const item={};
      headers.forEach((h,i) => item[h] = row[i] ?? "");
      return item;
    }).filter(x => String(x["English"]||"").trim() || String(x["Asrydian / Asmonian"]||"").trim());
    populateCategories();
    document.querySelector(".badge").textContent = `${dictionary.length} live entries`;
    render();
  }catch(err){
    console.error(err);
    stats.textContent = "Could not load the live dictionary.";
    results.innerHTML = `<div class="empty warning">
      <strong>Live sheet connection failed.</strong><br><br>
      Confirm that the Google Sheet is shared as “Anyone with the link — Viewer,”
      and that the first tab is named <strong>MASTER DICTIONARY</strong>.<br><br>
      Error: ${escapeHtml(err.message)}
    </div>`;
  }
}
loadLiveDictionary();
</script>
</body>
</html>
